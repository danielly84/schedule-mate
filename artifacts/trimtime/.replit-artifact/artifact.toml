kind = "web"
previewPath = "/"
title = "TrimTime"
version = "1.0.0"
id = "artifacts/trimtime"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25424

[services.development]
run = "pnpm --filter @workspace/trimtime run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trimtime", "run", "build" ]
publicDir = "artifacts/trimtime/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25424"
BASE_PATH = "/"
